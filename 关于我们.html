<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>关于 - QZ 公共资源库</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #e4edf5 100%);
            color: #333;
            min-height: 100vh;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        .page-header {
            text-align: center;
            padding: 40px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            margin-bottom: 40px;
        }
        .content-card {
            background: white;
            padding: 30px;
            border-radius: 18px;
            margin: 30px 0;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.05);
        }
        .back-btn {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 30px;
            background: linear-gradient(90deg, #2d8cff, #00c6ff);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="page-header">
            <h1><i class="fas fa-info-circle"></i> 关于 QZ 公共资源库</h1>

        </div>
        
        <div class="content-card">
            <h2><i class="fas fa-bullseye"></i> 我们的使命</h2>
            <div class="placeholder">
                <strong>【你的使命描述】</strong><br>
                <textarea style="width:100%; height:100px; margin-top:15px;"></textarea>
            </div>
        </div>
        
        <div class="content-card">

            <div class="placeholder">
                <strong>【你的愿景描述】</strong><br>
                <textarea style="width:100%; height:100px; margin-top:15px;"></textarea>
            </div>
        </div>
        
        <div class="content-card">
            <h2><i class="fas fa-heart"></i> 核心价值观</h2>
            <div class="placeholder">
                <strong>【你的核心价值观】</strong><br>
                <textarea style="width:100%; height:150px; margin-top:15px;"></textarea>
            </div>
        </div>
        
        <div style="text-align: center;">
            <a href="index.html" class="back-btn">
                <i class="fas fa-arrow-left"></i> 返回主页
            </a>
        </div>
    </div>

</html>
